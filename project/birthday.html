<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Reminder App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-5">Birthday Reminder App</h1>
        
        <!-- Add Birthday Form -->
        <div class="card mt-4">
            <div class="card-body">
                <form id="birthdayForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Person's Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="dob" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="dob" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Birthday</button>
                </form>
            </div>
        </div>

        <!-- Birthday List -->
        <div class="card mt-4">
            <div class="card-body">
                <h2>Upcoming Birthdays</h2>
                <ul id="birthdayList" class="list-group">
                    <!-- Birthday entries will appear here -->
                </ul>
            </div>
        </div>
    </div>

    <script src="scriprt.js"></script>
</body>
</html>
